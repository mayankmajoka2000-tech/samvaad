# Samvaad settings. setup.ps1 copies this file to config.toml; edit config.toml, not this one.

[server]
host = "127.0.0.1"      # run.ps1 -Lan listens on the local network too, for Beacon
port = 8765
open_browser = true

[asr]
# qnn          = Whisper on the Snapdragon NPU (default)
# transformers = Whisper on the CPU (fallback; needs PyTorch)
# mock         = scripted lines, for trying the interface without models
engine = "qnn"
model_size = "base"
encoder = "models/whisper/encoder.onnx"
decoder = "models/whisper/decoder.onnx"
partial_interval_s = 1.2   # live partial captions while someone speaks; 0 turns them off

[llm]
# Any OpenAI-compatible server. GenieX runs Qwen3 on the NPU: start it with `geniex serve`.
engine = "openai"
base_url = "http://127.0.0.1:18181/v1"
model = "ai-hub-models/Qwen3-4B-Instruct-2507"
api_key = "geniex"
timeout = 60

[conversation]
lang_a = "en"
lang_b = "hi"
label_a = "Doctor"
label_b = "Patient"

[beacon]
name = "Priya"       # Beacon buzzes when someone says this name
side = "b"           # the Beacon user is person B
aliases = []         # other spellings, e.g. ["प्रिया"]

[session]
save_dir = "sessions"

# Terms that must always be translated the same way.
[glossary]
# "ASHA" = "आशा कार्यकर्ता"
